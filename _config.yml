title: TestConCiencia
description: "Herramientas web gratuitas que se ejecutan 100% en tu navegador: tus archivos nunca salen de tu equipo."
url: "https://www.testconciencia.com"
# Verso que aparece junto al titular de la portada (déjalo vacío para ocultarlo).
# Es un verso de ejemplo: cámbialo por una letra tuya.
verso: |
  «Que nadie guarde copia
  de lo que fuimos esta noche.»
baseurl: ""
markdown: kramdown

plugins:
  - jekyll-sitemap

# /kiwikos-lab/ se mantiene solo como redirección temporal a kiwikolab.com;
# no debe aparecer en el sitemap ni indexarse.
defaults:
  - scope:
      path: "kiwikos-lab"
    values:
      sitemap: false

exclude:
  - BACKLOG.md
  - Gemfile
  - Gemfile.lock
  - vendor
