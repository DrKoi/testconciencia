<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>TabWIP</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --fg: #1c1917;
        --muted: #78716c;
        --border: #e7e5e4;
        --accent: #0891b2;
        --accent-fg: #ffffff;
        --parking: #b45309;
        --danger: #b91c1c;
        --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #18181b;
          --fg: #f4f4f5;
          --muted: #a1a1aa;
          --border: #3f3f46;
          --accent: #22d3ee;
          --accent-fg: #052e33;
          --parking: #fbbf24;
          --danger: #f87171;
          --card: #27272a;
        }
      }
      :root[data-theme='dark'] {
        --bg: #18181b;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --border: #3f3f46;
        --accent: #22d3ee;
        --accent-fg: #052e33;
        --parking: #fbbf24;
        --danger: #f87171;
        --card: #27272a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 320px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      main {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status {
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .status-line {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.on {
        background: var(--accent);
      }
      .status-sub {
        color: var(--muted);
        margin-top: 4px;
      }
      button {
        font: inherit;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        padding: 9px 12px;
        cursor: pointer;
        width: 100%;
      }
      button:hover {
        filter: brightness(0.97);
      }
      button:active {
        filter: brightness(0.93);
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: transparent;
        font-weight: 600;
      }
      button.complete {
        border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        text-align: center;
      }
      .stat {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 4px;
        background: var(--card);
      }
      .stat strong {
        display: block;
        font-size: 17px;
      }
      .stat span {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .toast {
        text-align: center;
        color: var(--accent);
        font-weight: 600;
        min-height: 16px;
      }
      footer {
        text-align: right;
      }
      footer a {
        color: var(--muted);
        text-decoration: none;
        font-size: 12px;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>🎯 TabWIP</h1>

      <section class="status">
        <div class="status-line">
          <span id="dot" class="dot"></span>
          <span id="statusText">Cargando...</span>
        </div>
        <div id="statusSub" class="status-sub"></div>
      </section>

      <div class="row">
        <button id="toggleFocusBtn" class="primary" disabled>...</button>
      </div>
      <button id="completeBtn" class="complete" disabled>✅ Completar pestana activa</button>
      <div id="toast" class="toast" aria-live="polite"></div>

      <div class="stats">
        <div class="stat"><strong id="statToday">0</strong><span>Hoy</span></div>
        <div class="stat"><strong id="statWeek">0</strong><span>Semana</span></div>
        <div class="stat"><strong id="statTotal">0</strong><span>Total</span></div>
      </div>

      <footer><a id="optionsLink" href="options.html">Preferencias</a></footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
